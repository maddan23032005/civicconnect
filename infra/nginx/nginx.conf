worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format  civic  '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'upstream=$upstream_addr rt=$request_time';

    access_log  logs/access.log  civic;
    error_log   logs/error.log   warn;

    # ---- LOAD BALANCED GATEWAY CLUSTER ----
    upstream civic_gateway {
        least_conn;
        server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream civic_frontend {
        server 127.0.0.1:5173;
    }

    server {
        listen       8080;
        server_name  localhost;

        client_max_body_size 12m;

        # API traffic -> gateway cluster
        location /api/ {
            proxy_pass         http://civic_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Served-By $upstream_addr always;
        }

        # Everything else -> React dev server
        location / {
            proxy_pass         http://civic_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        location /nginx-health {
            return 200 "nginx up\n";
            add_header Content-Type text/plain;
        }
    }
}
